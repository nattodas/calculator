<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">
    <div id="display">
        <p id="pastCalcDisplay"></p>
        <p id="currentCalcDisplay"></p>
    </div>
    <div class="buttons">
        <button class="btn btnOne clearBtn" value="clear">Clear</button>
        <button class="btn btnTwo deleteBtn" value="delete">Delete</button>
        <button class="btn operatorBtn" value="√">√</button>
        <button class="btn operatorBtn" value="÷">÷</button>
        <button class="btn digit" value="7">7</button>
        <button class="btn digit" value="8">8</button>
        <button class="btn digit" value="9">9</button>
        <button class="btn operatorBtn" value="x">x</button>
        <button class="btn digit" value="4">4</button>
        <button class="btn digit" value="5">5</button>
        <button class="btn digit" value="6">6</button>
        <button class="btn operatorBtn" value="-">-</button>
        <button class="btn digit" value="1">1</button>
        <button class="btn digit" value="2">2</button>
        <button class="btn digit" value="3">3</button>
        <button class="btn operatorBtn" value="+">+</button>
        <button class="btn digit" value="0">0</button>
        <button class="btn digit" value=".">.</button>
        <button class="btn btnNineteen equals" value="=">=</button>
    </div>
</div>

<script src="javascript.js"></script>
</body>
</html>
